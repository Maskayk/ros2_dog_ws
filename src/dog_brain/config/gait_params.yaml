trot_node:
  ros__parameters:
    gait:
      period: 0.8          # период одного шага (с). 0.8 = медленнее, стабильнее
      duty_factor: 0.6     # 60% stance, 40% swing (стандартный trot)

    trajectory:
      z_nominal: -0.25     # standing height (m)
      x_standing: 0.0      # FK foot.x offset for CoM compensation (m)
      step_height: 0.04    # foot lift during swing (m)
      step_amp_x: 0.06     # амплитуда шага (м на 1 м/с)
      yaw_lever: 0.08      # плечо для поворота (м)

    stabilization:
      enabled: false
      kp_roll: 0.3
      kp_pitch: 0.3
      kd_roll: 0.0
      kd_pitch: 0.0
      max_correction_z: 0.02
      max_correction_x: 0.02

    filter:
      alpha: 0.1                  # сглаживание скорости (меньше = плавнее)
      stationary_threshold: 0.02  # ниже = стоим, выше = идём

    startup:
      ramp_duration: 1.5   # рамп от spawn-позы до стойки (с)
      settle_time: 0.5     # удержание стойки перед гейтом (с)
