trot_node:
  ros__parameters:
    # Параметры походки
    gait:
      period: 0.6
      duty_factor: 0.65

    # Параметры траектории стопы
    trajectory:
      z_nominal: -0.22
      step_height: 0.03
      step_amp_x: 0.03
      yaw_lever: 0.08

    # Стабилизация корпуса (IMU)
    stabilization:
      enabled: false
      kp_roll: 0.3
      kp_pitch: 0.3
      kd_roll: 0.0
      kd_pitch: 0.0
      max_correction_z: 0.02
      max_correction_x: 0.02

    # Фильтр скорости
    filter:
      alpha: 0.15
      stationary_threshold: 0.01

    # Startup ramp: плавный переход от spawn-позы к стойке
    startup:
      ramp_duration: 2.0
